<meta name="description" content="Syllogism Board — draw categorical, relational and inductive arguments as graphs and check them. Available in 10 languages.">
<script>
// Pick a board: the language chosen last time, else the browser's language, else English.
(function(){
  var FILES = { en:'syllogism_board_en.html', ko:'syllogism_board.html', zh:'syllogism_board_zh.html', ja:'syllogism_board_ja.html',
                es:'syllogism_board_es.html', pt:'syllogism_board_pt.html', fr:'syllogism_board_fr.html', de:'syllogism_board_de.html',
                it:'syllogism_board_it.html', ru:'syllogism_board_ru.html' };
  var pick = null;
  try { var saved = localStorage.getItem('syllogismBoardLang'); if(FILES[saved]) pick = saved; } catch(e){}
  if(!pick){
    var langs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ''];
    for(var i = 0; i < langs.length && !pick; i++){
      var c = String(langs[i] || '').toLowerCase().slice(0, 2);
      if(FILES[c]) pick = c;
    }
  }
  location.replace(FILES[pick || 'en'] + location.search + location.hash);
})();
</script>
